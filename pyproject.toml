[project]
name = "ddpm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irfan Mehmud", email = "irfanmehmud140@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ddpm = "ddpm:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
