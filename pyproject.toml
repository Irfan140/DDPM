[project]
name = "ddpm"
version = "0.1.0"
description = "Modular Fashion-MNIST DDPM training and inference"
readme = "README.md"
authors = [
    { name = "Irfan Mehmud", email = "irfanmehmud140@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "wandb>=0.19.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ddpm-train = "training.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "diffusion", "model"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "training*"]

